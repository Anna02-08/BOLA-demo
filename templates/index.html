
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BOLA Security Lab</title>

    <link rel="stylesheet"
          href="/static/style.css">
</head>
<body>

    <header>
        <h1>BOLA Security Lab</h1>
        <p>Broken Object Level Authorization Demo</p>
    </header>

    <main>
        <section class="panel">
            <h2>Configure Request</h2>

            <label for="user">Authenticated user</label>
            <select id="user">
                <option value="alice">Alice</option>
                <option value="bob">Bob</option>
            </select>

            <label for="mode">API Mode</label>
            <select id="mode">
                <option value="vulnerable">
                    Vulnerable API
                </option>
                <option value="secure">
                    Secure API
                </option>
            </select>

            <label for="document">Document ID</label>
            <input type="number"
                   id="document"
                   value="2"
                   min="1">

            <button id="sendRequest">
                Send Request
            </button>
        </section>

        <section class="panel">
            <h2>API Response</h2>

            <p id="status">Status: Not sent</p>

            <pre id="response">
No request sent yet.
            </pre>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
