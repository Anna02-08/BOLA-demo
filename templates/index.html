
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>BOLA Security Lab</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="workspace">

    <div class="workspace-title">
        <div>
            <h1>Demonstration of BOLA Vulnerabilities</h1>
            </div>
        <button id="resetButton" type="button">
            ↻ Reset Data
        </button>
    </div>

    <div class="request-bar">
        <select id="method" aria-label="HTTP Method">
            <option value="GET">GET</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
        </select>

        <div id="endpointPreview" class="endpoint"></div>

        <button id="sendRequest">Send Request</button>
    </div>

    <main class="panels">

        <section class="panel">
            <div class="panel-heading">
                <h2>Request</h2>
            </div>

            <div class="form-grid">
                <div>
                    <label for="user">Authenticated user</label>
                    <select id="user">
                        <option value="alice">Alice</option>
                        <option value="bob">Bob</option>
                    </select>
                </div>

                <div>
                    <label for="mode">API mode</label>
                    <select id="mode">
                        <option value="vulnerable">
                            Vulnerable
                        </option>
                        <option value="secure">
                            Secure
                        </option>
                    </select>
                </div>
            </div>

            <label for="document">Document ID</label>
            <input type="number" id="document" value="2" min="1">

            <div id="updateForm" style="display: none;">
                <label for="newTitle">Request Body – New Title</label>
                <input type="text"
                       id="newTitle"
                       value="Modified by Alice"
                       maxlength="120">
            </div>

            <div class="info">
                <strong>Authorization header</strong>
                <code id="authPreview">
                    Authorization: Bearer alice-token
                </code>
            </div>
        </section>

        <section class="panel">
            <div class="panel-heading">
                <h2>Response</h2>
                <span id="status" class="status">
                    Not sent
                </span>
            </div>

            <pre id="response">No request sent yet.</pre>
        </section>

    </main>
</div>

<script src="/static/script.js"></script>
</body>
</html>
